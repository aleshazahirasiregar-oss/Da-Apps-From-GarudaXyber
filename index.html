<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading... ⏳</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f0f0f;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            color: #ff0055;
            text-shadow: 0 0 10px #ff0055, 0 0 20px #ff0055;
            animation: pulse 1s infinite alternate;
            margin-bottom: 20px;
            padding: 0 20px;
        }

        p {
            font-size: 1.2rem;
            color: #00ffcc;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.05); opacity: 1; }
        }

        /* Menyembunyikan iframe YouTube agar fokus ke efek lirik/suara */
        .hidden-player {
            position: absolute;
            width: 0;
            height: 0;
            border: 0;
            pointer-events: none;
            opacity: 0;
        }
    </style>
</head>
<body>

    <h1 id="dynamic-title">Loading... ⏳</h1>
    <p>Never gonna give you up! 🎶</p>

    <!-- YouTube Embed Full Video otomatis -->
    <iframe class="hidden-player" 
            src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1&enablejsapi=1" 
            allow="autoplay">
    </iframe>

    <script>
        // Array judul dan teks sesuai lirik Rickroll
        const rickrollLyrics = [
            "Loading... ⏳",
            "Never gonna give you up 🎶",
            "Never gonna let you down 🎵",
            "Never gonna run around...",
            "and desert you! 😂",
            "Got Rickrolled! 🎤"
        ];
        
        let index = 0;
        setInterval(() => {
            index = (index + 1) % rickrollLyrics.length;
            document.title = rickrollLyrics[index];
            document.getElementById("dynamic-title").innerText = rickrollLyrics[index];
        }, 2500); // Berganti setiap 2.5 detik
    </script>

</body>
</html>
